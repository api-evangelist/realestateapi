openapi: 3.1.0
info:
  title: RealEstate AVM MLS API
  description: RealEstateAPI.com provides expressive property data APIs for prop-tech applications. Endpoints include property search, property detail, comparables, AVM (automated valuation), parcel boundary lookups, MLS data, skip tracing, and involuntary lien data. All endpoints accept JSON and require an x-api-key header.
  version: '1.0'
  contact:
    name: RealEstateAPI Support
    url: https://www.realestateapi.com/
servers:
- url: https://api.realestateapi.com
  description: RealEstateAPI production base URL
security:
- apiKeyAuth: []
tags:
- name: MLS
  description: MLS listing data
paths:
  /v2/MLSSearch:
    post:
      tags:
      - MLS
      summary: Search MLS active and historical listings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: MLS listings
  /v2/MLSDetail:
    post:
      tags:
      - MLS
      summary: Retrieve MLS listing detail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mls_id:
                  type: string
      responses:
        '200':
          description: MLS detail
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: RealEstateAPI account API key.
